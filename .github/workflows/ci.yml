name: CI

on:
  push:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
  workflow_dispatch:

permissions:
  contents: read

env:
  # Fail fast and retry when an apt mirror stalls, instead of hanging.
  APT_OPTS: -o APT::Keep-Downloaded-Packages=true -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30

jobs:
  test:
    name: PostgreSQL ${{ matrix.pg }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        pg: [17, 18]
    env:
      PG_CONFIG: /usr/lib/postgresql/${{ matrix.pg }}/bin/pg_config
      PGBIN: /usr/lib/postgresql/${{ matrix.pg }}/bin
      PGHOST: /tmp
      PGPORT: "5499"
      PGUSER: postgres
    steps:
      - uses: actions/checkout@v4

      - name: Restore apt .deb cache
        uses: actions/cache@v4
        with:
          path: ~/apt-cache
          key: apt-test-pg${{ matrix.pg }}-${{ runner.os }}-${{ hashFiles('.github/workflows/ci.yml') }}
          restore-keys: |
            apt-test-pg${{ matrix.pg }}-${{ runner.os }}-

      - name: Seed apt archives from cache
        run: |
          mkdir -p ~/apt-cache
          n=$(find ~/apt-cache -name '*.deb' | wc -l); echo "cached debs: $n"
          if [ "$n" -gt 0 ]; then sudo cp -n ~/apt-cache/*.deb /var/cache/apt/archives/ || true; fi

      - name: Install PostgreSQL ${{ matrix.pg }} from PGDG
        run: |
          retry() { for n in 1 2 3; do timeout 300 "$@" && return 0; echo "attempt $n failed: $*"; sleep 10; done; return 1; }
          retry sudo apt-get $APT_OPTS update -q
          retry sudo apt-get $APT_OPTS install -y -q postgresql-common
          retry sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          retry sudo apt-get $APT_OPTS install -y -q postgresql-${{ matrix.pg }} postgresql-server-dev-${{ matrix.pg }}

      - name: Save downloaded debs to cache dir
        if: always()
        run: |
          cp -u /var/cache/apt/archives/*.deb ~/apt-cache/ 2>/dev/null || true
          sudo chown -R "$(id -u):$(id -g)" ~/apt-cache
          du -sh ~/apt-cache || true

      - name: Build (PGXS)
        run: make PG_CONFIG="$PG_CONFIG" COPT=-Werror

      - name: Install
        run: sudo make install PG_CONFIG="$PG_CONFIG"

      - name: Start a test cluster with shared_preload_libraries = pg_nanotime
        run: |
          "$PGBIN/initdb" -D "$RUNNER_TEMP/pgdata" -U postgres --auth=trust
          cat >> "$RUNNER_TEMP/pgdata/postgresql.conf" <<CONF
          port = $PGPORT
          unix_socket_directories = '/tmp'
          shared_preload_libraries = 'pg_nanotime'
          CONF
          "$PGBIN/pg_ctl" -D "$RUNNER_TEMP/pgdata" -l "$RUNNER_TEMP/pg.log" -w start

      - name: make installcheck (preloaded)
        run: make installcheck PG_CONFIG="$PG_CONFIG"

      - name: Upgrade 0.1.0 -> current matches a fresh install
        run: |
          "$PGBIN/psql" -X -v ON_ERROR_STOP=1 -c "CREATE DATABASE up_old" -c "CREATE DATABASE up_new"
          "$PGBIN/psql" -X -v ON_ERROR_STOP=1 -d up_old -c "CREATE EXTENSION pg_nanotime VERSION '0.1.0'" -c "ALTER EXTENSION pg_nanotime UPDATE"
          "$PGBIN/psql" -X -v ON_ERROR_STOP=1 -d up_new -c "CREATE EXTENSION pg_nanotime"
          "$PGBIN/psql" -X -d up_old -c '\dx+ pg_nanotime' > "$RUNNER_TEMP/up_old.txt"
          "$PGBIN/psql" -X -d up_new -c '\dx+ pg_nanotime' > "$RUNNER_TEMP/up_new.txt"
          diff "$RUNNER_TEMP/up_old.txt" "$RUNNER_TEMP/up_new.txt"
          "$PGBIN/psql" -X -v ON_ERROR_STOP=1 -c "DROP DATABASE up_old" -c "DROP DATABASE up_new"

      - name: global test without shared_preload_libraries (expects global_1.out)
        run: |
          sed -i "s/^shared_preload_libraries = .*/shared_preload_libraries = ''/" "$RUNNER_TEMP/pgdata/postgresql.conf"
          "$PGBIN/pg_ctl" -D "$RUNNER_TEMP/pgdata" -l "$RUNNER_TEMP/pg.log" -w restart
          make installcheck PG_CONFIG="$PG_CONFIG" REGRESS="global"

      - name: Show regression diffs
        if: failure()
        run: |
          cat test/regression.diffs 2>/dev/null || true
          cat "$RUNNER_TEMP/pg.log" 2>/dev/null || true

  timescaledb:
    name: TimescaleDB on PostgreSQL ${{ matrix.pg }} (optional)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # TimescaleDB packages may lag new PostgreSQL releases; do not block CI on them.
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        pg: [17, 18]
    env:
      PG_CONFIG: /usr/lib/postgresql/${{ matrix.pg }}/bin/pg_config
      PGBIN: /usr/lib/postgresql/${{ matrix.pg }}/bin
      PGHOST: /tmp
      PGPORT: "5499"
      PGUSER: postgres
    steps:
      - uses: actions/checkout@v4

      - name: Restore apt .deb cache
        uses: actions/cache@v4
        with:
          path: ~/apt-cache
          key: apt-tsdb-pg${{ matrix.pg }}-${{ runner.os }}-${{ hashFiles('.github/workflows/ci.yml') }}
          restore-keys: |
            apt-tsdb-pg${{ matrix.pg }}-${{ runner.os }}-

      - name: Seed apt archives from cache
        run: |
          mkdir -p ~/apt-cache
          n=$(find ~/apt-cache -name '*.deb' | wc -l); echo "cached debs: $n"
          if [ "$n" -gt 0 ]; then sudo cp -n ~/apt-cache/*.deb /var/cache/apt/archives/ || true; fi

      - name: Install PostgreSQL ${{ matrix.pg }} and TimescaleDB
        run: |
          retry() { for n in 1 2 3; do timeout 300 "$@" && return 0; echo "attempt $n failed: $*"; sleep 10; done; return 1; }
          retry sudo apt-get $APT_OPTS update -q
          retry sudo apt-get $APT_OPTS install -y -q postgresql-common curl gnupg
          retry sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          curl -fsSL --retry 3 --max-time 60 https://packagecloud.io/timescale/timescaledb/gpgkey | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/timescaledb.gpg
          echo "deb https://packagecloud.io/timescale/timescaledb/ubuntu/ $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/timescaledb.list
          retry sudo apt-get $APT_OPTS update -q
          retry sudo apt-get $APT_OPTS install -y -q postgresql-${{ matrix.pg }} postgresql-server-dev-${{ matrix.pg }} timescaledb-2-postgresql-${{ matrix.pg }}

      - name: Save downloaded debs to cache dir
        if: always()
        run: |
          cp -u /var/cache/apt/archives/*.deb ~/apt-cache/ 2>/dev/null || true
          sudo chown -R "$(id -u):$(id -g)" ~/apt-cache
          du -sh ~/apt-cache || true

      - name: Build and install
        run: |
          make PG_CONFIG="$PG_CONFIG"
          sudo make install PG_CONFIG="$PG_CONFIG"

      - name: Start cluster (timescaledb, pg_nanotime preloaded)
        run: |
          "$PGBIN/initdb" -D "$RUNNER_TEMP/pgdata" -U postgres --auth=trust
          cat >> "$RUNNER_TEMP/pgdata/postgresql.conf" <<CONF
          port = $PGPORT
          unix_socket_directories = '/tmp'
          shared_preload_libraries = 'timescaledb, pg_nanotime'
          timescaledb.telemetry_level = off
          CONF
          "$PGBIN/pg_ctl" -D "$RUNNER_TEMP/pgdata" -l "$RUNNER_TEMP/pg.log" -w start

      - name: make installcheck WITH_TIMESCALEDB=1
        run: make installcheck PG_CONFIG="$PG_CONFIG" WITH_TIMESCALEDB=1

      - name: Show regression diffs
        if: failure()
        run: cat test/regression.diffs 2>/dev/null || true
